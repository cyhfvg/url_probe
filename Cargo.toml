[package]
name = "url_probe"
version = "0.1.2"
edition = "2024"
description = "A command-line tool for checking HTTP/HTTPS endpoints and recording response metadata."
license = "BSD-3-Clause"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
csv = "1.4.0"
futures = "0.3.32"
fastrand = "2.3.0"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "charset", "http2", "socks"] }
scraper = "0.26.0"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.8"

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "url_probe_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
